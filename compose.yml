# DockiUp with its database. Settings come from .env next to this file (see .env.example).
# Everything it keeps lives in /data/dockiup on the host: the database and the projects it creates.
services:
  dockiup:
    image: pianonic/dockiup:latest # or ghcr.io/pianonic/dockiup:latest
    container_name: dockiup
    environment:
      ConnectionStrings__DockiUpDatabase: "Host=db;Port=5432;Database=dockiup;Username=postgres;Password=${POSTGRES_PASSWORD}"
      SystemPaths__ProjectsPath: /data/dockiup/projects
      Vault__MasterKey: ${VAULT_MASTER_KEY}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out, so relative mounts in your projects point at the right host folder.
      - /data/dockiup:/data/dockiup
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: dockiup-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dockiup
    volumes:
      - /data/dockiup/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped
