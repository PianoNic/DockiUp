name: Release

# The image is built from main *after* the version bump, so the version the app reports is the
# version that was released - nothing is stamped separately from the tag.

on:
  release:
    types: [published]

jobs:
  sync-version:
    name: Bump version to the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configure git as the maintainer
        run: |
          git config user.name "PianoNic"
          git config user.email "79938743+PianoNic@users.noreply.github.com"

      # The app reports the assembly version (<Version> in DockiUp.API.csproj) in the side rail and /api/App.
      - name: Bump DockiUp.API.csproj and push to main
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Tags ship inconsistently cased (e.g. "V1.4.0"); strip any non-digit prefix.
          VERSION="$(printf '%s' "$TAG_NAME" | sed -E 's/^[^0-9]*//')"
          FILE=src/DockiUp.API/DockiUp.API.csproj
          CURRENT="$(sed -nE 's#.*<Version>([^<]*)</Version>.*#\1#p' "$FILE")"
          echo "Release tag version: $VERSION"
          echo "File version:        $CURRENT"

          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Already in sync, nothing to commit."
            exit 0
          fi

          sed -i -E "s#<Version>[^<]*</Version>#<Version>$VERSION</Version>#" "$FILE"
          git add "$FILE"
          git commit -m "Bumped DockiUp.API.csproj to $VERSION for release [skip ci]"
          git push origin HEAD:main

  docker:
    name: Build and push multi-arch image
    needs: sync-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Prepare repository name
        id: prep
        run: echo "repository_lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      # The build stages run on the runner's own architecture (see the Dockerfile), so the arm64 image
      # needs emulation only for its final apt step.
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/DockiUp.API/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ steps.prep.outputs.repository_lowercase }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ steps.prep.outputs.repository_lowercase }}:buildcache,mode=max
          provenance: false
          sbom: false
