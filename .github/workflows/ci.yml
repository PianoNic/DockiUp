name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/DockiUp.Tests/DockiUp.Tests.csproj

      - name: Build
        run: dotnet build src/DockiUp.Tests/DockiUp.Tests.csproj --configuration Release --no-restore

      # Unit tests only: Docker and Git are mocked or run against temp folders, so nothing external is needed.
      - name: Test
        run: dotnet test src/DockiUp.Tests/DockiUp.Tests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DockiUp.Frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DockiUp.Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration=production

  # The image the release publishes, built (not pushed) on every change, so a broken Dockerfile shows up here.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/DockiUp.API/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
