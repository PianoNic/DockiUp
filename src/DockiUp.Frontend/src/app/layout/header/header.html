<div class="account">
  <app-task-center [extended]="!collapsed()" />

  @if (authEnabled() && !isAuthenticated()) {
    <button type="button" class="rail-item" (click)="login()" aria-label="Login"
      [matTooltip]="collapsed() ? 'Login' : ''" matTooltipPosition="right">
      <mat-icon>login</mat-icon>
      @if (!collapsed()) { <span>Login</span> }
    </button>
  } @else {
    <!-- Straight to the profile: theme and sign-out live there. -->
    <a class="user-card" routerLink="/me" routerLinkActive="active" [attr.aria-label]="'Profile of ' + displayName()"
      [matTooltip]="collapsed() ? displayName() : ''" matTooltipPosition="right">
      @if (picture() && !pictureFailed()) {
        <img class="avatar" [src]="picture()" alt="" referrerpolicy="no-referrer" (error)="pictureFailed.set(true)" />
      } @else {
        <span class="avatar initials">{{ initials() }}</span>
      }
      @if (!collapsed()) {
        <span class="who">
          <span class="name">{{ displayName() }}</span>
          <span class="meta">{{ version() }}</span>
        </span>
      }
    </a>
  }
</div>
