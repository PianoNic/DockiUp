<div class="x-page nodes-page">
  <header class="x-page-header">
    <div>
      <span class="x-eyebrow">Infrastructure</span>
      <h1 class="x-title">Nodes</h1>
      <p class="x-sub">This host and every node, with live usage</p>
    </div>
    <div class="x-actions">
      <button matButton="filled" (click)="addNode()"><mat-icon>add</mat-icon> Add node</button>
    </div>
  </header>

  @if (loading() && nodes().length === 0) { <mat-progress-bar mode="indeterminate" /> }
  @if (error(); as err) { <p class="error">{{ err }}</p> }

  <div class="scroll">
    <section class="totals" aria-label="Totals">
      @for (t of totals(); track t.label) {
        <div class="total">
          <span class="k">{{ t.label }}</span>
          <b>{{ t.value }}</b>
          <span class="k">{{ t.sub }}</span>
        </div>
      }
    </section>

    <section class="grid" aria-label="Hosts">
      @for (h of hosts(); track h.nodeId ?? 'local') {
        <app-host-card
          [nodeId]="h.nodeId"
          [name]="h.name"
          [state]="h.state"
          [lastSeenAt]="h.lastSeenAt"
          [stats]="hostStats.stats(h.nodeId)"
          [lastHour]="hostStats.summary(h.nodeId)?.lastHour ?? []"
          [containers]="containersOf(h.nodeId)"
          [removing]="!!h.nodeId && !!deleting()[h.nodeId]"
          (remove)="h.node && remove(h.node)" />
      }
      <button type="button" class="x-card add-card" (click)="addNode()">
        <span class="x-shape primary round"><mat-icon>add</mat-icon></span>
        <span class="add-title">Connect another host</span>
        <span class="k">Add a node to get a ready-to-run compose with a fresh token. Run it on the host; it dials back here.</span>
      </button>
    </section>
  </div>
</div>
